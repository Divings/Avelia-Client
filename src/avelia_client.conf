# Avelia Client connection settings
# TLS settings are read from environment variables by Avelia_client_TLS_applied.py.

[CONNECTION]
host = 127.0.0.1
port = 47500

# TLS environment variables used by the client:
# AVELIA_TLS_CA_FILE=/etc/avelia/tls/ca.crt
# AVELIA_TLS_SERVER_NAME=avelia-server
#
# Optional mTLS:
# AVELIA_TLS_CLIENT_CERT_FILE=/etc/avelia/tls/client.crt
# AVELIA_TLS_CLIENT_KEY_FILE=/etc/avelia/tls/client.key
